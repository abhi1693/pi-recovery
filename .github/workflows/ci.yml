name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    uses: abhi1693/actions/.github/workflows/python-ci.yml@4bc25a3100cbfbece517ddad161d59d13c029675 # v1
    with:
      runs-on: ubuntu-24.04-arm
      python-version: '3.15'
      enable-cache: false
      sync-command: python -m compileall -q controller.py policy.py
      test-command: python -m unittest discover -s tests -v
  images:
    needs: tests
    uses: abhi1693/actions/.github/workflows/container-images.yml@4bc25a3100cbfbece517ddad161d59d13c029675 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version-file: pyproject.toml
      latest: false
      publish: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
